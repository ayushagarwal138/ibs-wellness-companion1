services:
  - type: web
    name: ibs-wellness-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
    # Use $PORT env var — Render assigns this dynamically (NOT always 10000)
    startCommand: "gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --workers 1 app.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"