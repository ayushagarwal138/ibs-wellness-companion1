<!DOCTYPE html>
<html>
<head>
    <title>Quick Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Quick Login Test</h2>
        <p>Use these test credentials:</p>
        <ul>
            <li><strong>Email:</strong> test@example.com</li>
            <li><strong>Password:</strong> password123</li>
        </ul>
        
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" value="test@example.com" required>
            <input type="password" id="password" placeholder="Password" value="password123" required>
            <button type="submit">Login</button>
        </form>
        
        <div id="result"></div>
        
        <div style="margin-top: 20px;">
            <button onclick="checkTokens()">Check Current Tokens</button>
            <button onclick="goToDashboard()">Go to Dashboard</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>Login Successful!</h3>
                        <p>User: ${data.user.first_name} ${data.user.last_name}</p>
                        <p>Email: ${data.user.email}</p>
                        <p>Tokens stored in localStorage</p>
                    `;
                } else {
                    const error = await response.json();
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<h3>Login Failed</h3><p>${error.message || error.detail}</p>`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<h3>Error</h3><p>${error.message}</p>`;
            }
        });
        
        function checkTokens() {
            const accessToken = localStorage.getItem('access_token');
            const refreshToken = localStorage.getItem('refresh_token');
            const resultDiv = document.getElementById('result');
            
            if (accessToken) {
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <h3>Tokens Found</h3>
                    <p><strong>Access Token:</strong> ${accessToken.substring(0, 50)}...</p>
                    <p><strong>Refresh Token:</strong> ${refreshToken ? refreshToken.substring(0, 50) + '...' : 'None'}</p>
                `;
            } else {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '<h3>No Tokens Found</h3><p>Please login first</p>';
            }
        }
        
        function fillTestCredentials() {
            // Test credentials
            document.getElementById('email').value = 'test@example.com';
            document.getElementById('password').value = 'password123';
        }
        
        function goToDashboard() {
            window.open('http://localhost:3000/dashboard', '_blank');
        }
    </script>
</body>
</html>
